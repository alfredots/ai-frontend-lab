name: Auto PR to main

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create pull request if missing
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const { owner, repo } = context.repo;

            const { data: existing } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${branch}`,
              base: 'main',
              state: 'open',
            });

            if (existing.length > 0) {
              core.info(`PR already open for ${branch} -> main: #${existing[0].number}`);
              return;
            }

            const { data: pr } = await github.rest.pulls.create({
              owner,
              repo,
              title: branch,
              head: branch,
              base: 'main',
              body: [
                '## Summary',
                `- Branch: \`${branch}\``,
                '- PR criada automaticamente ao fazer push.',
                '',
                '## Test plan',
                '- [ ] Revisar alterações',
                '- [ ] Validar CI',
              ].join('\n'),
            });

            core.info(`Created PR #${pr.number}: ${branch} -> main`);
